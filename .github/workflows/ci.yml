# The warm-up regression, in CI.
#
# What this runs, and nothing else:
#   lint -> CLI-contract selftest -> iverilog + pinned-PDK provisioning
#        -> fetch -> tools/sim self-test gate -> warm-up regression
#        -> puzzle extraction regression -> tracked-file check
#
# Publishing constraints this workflow is written against. The §1 embargo was
# lifted 2026-09-04; what still binds is §3 (do not vendor the unlicensed
# puzzle files), and the read-only posture below is kept as a safeguard:
#
#   * `permissions:` is read-only and explicit. No job requests `administration`
#     or `contents: write`, so no step here is *capable* of flipping repository
#     visibility, pushing, or writing to another repository — that is
#     operator-only across the fleet, and here it is also a commitment to a
#     third party.
#   * The checkout does not persist credentials, so nothing downstream can use
#     the job token to push.
#   * `puzzle/puzzle.gds` is fetched by scripts/fetch-puzzle.sh (which verifies
#     it) and read by scripts/puzzle-regression.sh (issue #68), which writes
#     only into gitignored build/. Nothing derived from it is committed.
#   * No artifacts are uploaded and no external service is called, so no log or
#     artifact leaves this repository.
#   * scripts/check-embargo.sh runs on every job as the last step: it asserts no
#     upstream puzzle file is tracked (CLAUDE.md §3).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Deliberately minimal: nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warmup-regression:
    name: Warm-up regression + embargo check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install klayout-tools (pinned) and klayout
        # Two consumers, both needed on the runner:
        #   * tools/extract (issue #2) reads GDS geometry directly via
        #     KLayout's Python API; the standalone `klayout` wheel satisfies
        #     klayout_env.py's "already importable" fast path.
        #   * warmup-regression.sh step 5 (issues #46, #63) cross-checks with
        #     `klt extract --abstract-cells`. klt is pinned to an exact version
        #     so a klayout-tools release that breaks extraction of this
        #     third-party layout is noticed when the pin is bumped, not
        #     silently. The regression step passes --require-klt so a missing
        #     klt fails the job rather than skipping.
        run: |
          # The klayout wheel is pinned too (klayout==0.30.13, the version the
          # current evidence was produced against): a klayout.db behaviour
          # change must surface at a deliberate bump, not at its upstream
          # release — same convention as the klayout-tools pin below it.
          pip install "klayout==0.30.13" "klayout-tools==0.9.2"
          klt --version

      - name: Install ruff
        # scripts/lint.sh's ruff check is opt-in: it runs only when `ruff` is
        # on PATH, and reports (not silently) a skip otherwise. Without this
        # step the runner never has ruff installed, so the ruff branch never
        # executes here and `ruff check` conformance is not actually a CI
        # guarantee despite the Lint job appearing to be strict (issue #24).
        # Ruff is pinned (klayout-tools pin convention): a release adding new
        # default rules must surface at a deliberate bump, not redden CI.
        run: pip install "ruff==0.17.5"

      - name: Lint (compile tools, parse scripts)
        run: ./scripts/lint.sh

      - name: CLI main() return-contract selftest (no PDK, no simulator, no solver)
        # issue #102: the five tools/sim CLIs had no automated main() coverage —
        # the pipeline only ever observed the shell exit status, which is how
        # #101's run_solve rc clobber (main() returning None instead of 0)
        # reached review. This asserts the main() return VALUES (exact ints,
        # not just exit status), including run_solve's `return rc` tail with
        # its collaborators mocked. Needs no PDK, no iverilog, no python-sat
        # and no puzzle/ files; kept ahead of the fetch so it is embargo-trivial.
        run: python3 -m tools.sim.selftest_cli

      - name: Celltable port-direction selftest (no PDK, no simulator)
        # issue #98: parse_port_directions() must recover signal-pin directions
        # from both port-declaration styles the open_pdks vintages emit —
        # `input wire A1;` (current installs) and the bare `input A1;` (older
        # ones) — and derive_cell_tables() must keep "defined but unparseable"
        # distinct from "not defined". Inline fixtures only: needs no PDK, no
        # iverilog and no fetched upstream files; kept ahead of the fetch so it
        # is embargo-trivial.
        run: python3 -m tools.sim.selftest_celltable

      - name: LVS verdict-comparison selftest (no PDK, no puzzle files)
        # issue #158: scripts/warmup-klt-lvs.sh used to exit 0 whenever the
        # runs completed, so neither a regression of the 01 match nor a move
        # in 02's pinned mismatch counts (243/242, tool-side,
        # klayout-tools#5632) could fail anything. tools/lvs-verdict now
        # compares the envelopes against evidence/warmup-klt-lvs-expected.json
        # after both references run; this step self-tests the comparator on
        # canned envelopes (both as pinned; 01 regressed; 02 count moved; 02
        # now match), asserting the exit codes AND that the moved value is
        # named with its direction. Inline fixtures only: no PDK, no puzzle/
        # files; kept ahead of the fetch so it is embargo-trivial.
        run: tools/test-lvs-verdict

      - name: Warm-up envelope verdicts as pinned (no PDK, no klt, no puzzle files)
        # issue #186 (gap left by #158's gate): the selftest above covers the
        # comparator on canned envelopes, and `klt lvs --check` only verifies
        # the recorded INPUT hashes (environment.layout_sha256 /
        # environment.reference_sha256) — nothing in CI asserted the committed
        # envelopes' recorded VERDICTS (01 match, 02's pinned 243 mismatch)
        # against evidence/warmup-klt-lvs-expected.json, since the comparator
        # otherwise only runs at the tail of scripts/warmup-klt-lvs.sh in
        # recording mode, which CI never invokes. This step runs it on the
        # committed pair directly: a hand-edited or stale envelope whose input
        # hashes stayed intact now fails CI with the moved value named. Needs
        # no PDK, no klt on PATH and no puzzle/ files; kept ahead of the fetch
        # so it is embargo-trivial and still runs if extraction cannot.
        run: tools/lvs-verdict evidence/warmup-klt-lvs-expected.json
          01:evidence/warmup-klt-lvs-01.json 02:evidence/warmup-klt-lvs-02.json

      - name: Warm-up LVS rejects invalid arguments before touching reports
        run: ./scripts/test-warmup-klt-lvs-args.sh

      - name: Fetch upstream puzzle files
        # janestreet/asic-puzzle-2026 carries no license; these land in puzzle/,
        # which is gitignored, and are never committed (CLAUDE.md §3).
        run: ./scripts/fetch-puzzle.sh

      - name: Install iverilog (Icarus Verilog)
        # issue #108: tools/sim simulates gate-level sky130_fd_sc_hd netlists
        # through Icarus (tools/sim/icarus.py). The sim self-test gate below
        # needs it; without this step it could only ever report a skip.
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Restore the pinned sky130 PDK from cache
        # issue #108: the sim self-test gate links sky130_fd_sc_hd's
        # behavioural Verilog (primitives.v + sky130_fd_sc_hd.v — ~4 MB of
        # what a sky130A install is). Provisioned into build/pdk-root
        # (gitignored, so the clean-tree assertion below stays green) and
        # cached keyed on the pinned open_pdks commit, so a re-pin
        # invalidates the cache.
        uses: actions/cache@v4
        with:
          path: build/pdk-root
          key: sky130-pdk-f6eeac7dad085ffcc829ccfd721f7b4ce39edcf7-sky130_fd_sc_hd

      - name: Provision the pinned sky130_fd_sc_hd behavioural models
        # issue #108. ciel (volare's successor) downloads per-library
        # tarballs, so -l sky130_fd_sc_hd narrows the install to the one
        # library these netlists use instead of a full sky130A. Both the
        # tool and the commit are pinned (klayout-tools==0.9.2 pin
        # convention): the commit is pinned literally so a model-file change
        # (the #98 class of breakage) should surface at the bump, not
        # silently, and ciel itself at 3.2.0 so the fetcher cannot change
        # under that pin. f6eeac7… is the install this repo's evidence was
        # produced against. Skipped when the cache already holds it.
        env:
          PDK_ROOT: ${{ github.workspace }}/build/pdk-root
        run: |
          if [ ! -f "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/verilog/sky130_fd_sc_hd.v" ]; then
            pip install "ciel==3.2.0"
            ciel enable --pdk sky130 f6eeac7dad085ffcc829ccfd721f7b4ce39edcf7 \
              -l sky130_fd_sc_hd --pdk-root "$PDK_ROOT"
          fi
          ls "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/verilog/"

      - name: Install python-sat (pinned)
        # issue #118: selftest_solve in the gate below needs pysat. Pinned
        # because python-sat has no PEP 440 final release — every PyPI
        # version is a .dev prerelease — so an unpinned install silently
        # tracks a moving tip (the same defect class the ciel==3.2.0 pin
        # fixed). An explicit == prerelease pin resolves without --pre and
        # installs from the cp312 manylinux wheel this ubuntu-latest /
        # python 3.12 job already uses, not from source.
        run: pip install "python-sat==1.9.dev12"

      - name: tools/sim self-test gate (iverilog + PDK models + python-sat)
        # issue #108: before this step, exactly one tools/sim module ran in
        # CI — selftest_cli above (issue #102, deliberately before the fetch
        # and left there) — while the library self-tests and the recorder's
        # shift-load protocol never executed anywhere automated.
        # scripts/sim-selftests.sh runs them, one ok/skip/FAIL line per
        # module. It also runs tools.sim.run_warmup_directed, the protocol's
        # SEMANTIC gate: selftest_replay records and replays against the
        # same netlist, so a recorder mutation moves both sides together and
        # still passes, while the directed run's expected_s (A + B == 496)
        # does not move. --require-pdk: with iverilog, the models and
        # python-sat provisioned above, a skip is a failure — a gate that
        # cannot run must never look like one that passed. selftest_solve
        # runs too (issue #118): it exercises the solver stack end to end
        # against the warm-up's published ground truth, so a regression in
        # solve.py, seqmodel.py or celltable.py now fails CI. Runs after the
        # fetch because selftest_replay, the directed run and selftest_solve
        # read puzzle/warmup/01_netlist.v.
        env:
          PDK_ROOT: ${{ github.workspace }}/build/pdk-root
        run: ./scripts/sim-selftests.sh --require-pdk

      - name: Warm-up regression (warm-up files only)
        # Runs tools/test-compare (comparator self-test + three mutation tests),
        # tools/test-inventory and tools/test-pins (inventory/pins self-tests,
        # issue #10), and the end-to-end 04_final.gds -> extract -> compare gate.
        # A missing/non-functional tools/extract is a hard failure, and so is a
        # missing klt (--require-klt, issue #63). Warm-up files only.
        run: ./scripts/warmup-regression.sh --no-fetch --require-klt

      - name: Warm-up LVS envelopes reproduce (klt lvs --check)
        # issue #159: re-extracts the warm-up layout netlist and runs the cheap
        # `klt lvs --check` on the COMMITTED envelopes, so a layout-netlist or
        # reference-netlist hash that no longer matches the recorded one fails
        # the job (--check exits 3 on drift). Never re-records the envelopes:
        # on klayout-tools==0.9.2 a fresh recording would anchor the reference
        # path on the nested puzzle/ clone (klayout-tools#5631, fixed after
        # 0.9.2) and fail --check. The version/engine DRIFT lines it prints are
        # informational (exit 0). Reuses the pinned sky130_fd_sc_hd install above.
        env:
          PDK_ROOT: ${{ github.workspace }}/build/pdk-root
        run: ./scripts/warmup-klt-lvs.sh --check-only

      - name: Puzzle extraction regression
        # issue #68: puzzle.gds -> tools/extract and klt extract -> compare
        # against evidence/puzzle-extracted.v, the one-floating-net invariant,
        # and a mutation check. Outputs land in gitignored build/.
        run: ./scripts/puzzle-regression.sh --no-fetch --require-klt

      - name: Assert no upstream puzzle file is tracked
        run: ./scripts/check-embargo.sh

      - name: Assert working tree is clean
        # Belt and braces on top of check-embargo.sh: a working tree that is not
        # clean after the run would mean the fetch or the regression wrote
        # something into version control.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after the run:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean; nothing from puzzle/ was staged."
