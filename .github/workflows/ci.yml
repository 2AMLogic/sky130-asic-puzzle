# The warm-up regression, in CI.
#
# What this runs, and nothing else:
#   lint -> comparator self-test + mutation suite -> warm-up regression
#        -> puzzle extraction regression -> tracked-file check
#
# Publishing constraints this workflow is written against. The §1 embargo was
# lifted 2026-09-04; what still binds is §3 (do not vendor the unlicensed
# puzzle files), and the read-only posture below is kept as a safeguard:
#
#   * `permissions:` is read-only and explicit. No job requests `administration`
#     or `contents: write`, so no step here is *capable* of flipping repository
#     visibility, pushing, or writing to another repository — that is
#     operator-only across the fleet, and here it is also a commitment to a
#     third party.
#   * The checkout does not persist credentials, so nothing downstream can use
#     the job token to push.
#   * `puzzle/puzzle.gds` is fetched by scripts/fetch-puzzle.sh (which verifies
#     it) and read by scripts/puzzle-regression.sh (issue #68), which writes
#     only into gitignored build/. Nothing derived from it is committed.
#   * No artifacts are uploaded and no external service is called, so no log or
#     artifact leaves this repository.
#   * scripts/check-embargo.sh runs on every job as the last step: it asserts no
#     upstream puzzle file is tracked (CLAUDE.md §3).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Deliberately minimal: nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warmup-regression:
    name: Warm-up regression + embargo check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install klayout-tools (pinned) and klayout
        # Two consumers, both needed on the runner:
        #   * tools/extract (issue #2) reads GDS geometry directly via
        #     KLayout's Python API; the standalone `klayout` wheel satisfies
        #     klayout_env.py's "already importable" fast path.
        #   * warmup-regression.sh step 5 (issues #46, #63) cross-checks with
        #     `klt extract --abstract-cells`. klt is pinned to an exact version
        #     so a klayout-tools release that breaks extraction of this
        #     third-party layout is noticed when the pin is bumped, not
        #     silently. The regression step passes --require-klt so a missing
        #     klt fails the job rather than skipping.
        run: |
          pip install klayout "klayout-tools==0.9.1"
          klt --version

      - name: Install ruff
        # scripts/lint.sh's ruff check is opt-in: it runs only when `ruff` is
        # on PATH, and reports (not silently) a skip otherwise. Without this
        # step the runner never has ruff installed, so the ruff branch never
        # executes here and `ruff check` conformance is not actually a CI
        # guarantee despite the Lint job appearing to be strict (issue #24).
        run: pip install ruff

      - name: Lint (compile tools, parse scripts)
        run: ./scripts/lint.sh

      - name: Fetch upstream puzzle files
        # janestreet/asic-puzzle-2026 carries no license; these land in puzzle/,
        # which is gitignored, and are never committed (CLAUDE.md §3).
        run: ./scripts/fetch-puzzle.sh

      - name: Warm-up regression (warm-up files only)
        # Runs tools/test-compare (comparator self-test + three mutation tests),
        # tools/test-inventory and tools/test-pins (inventory/pins self-tests,
        # issue #10), and the end-to-end 04_final.gds -> extract -> compare gate.
        # A missing/non-functional tools/extract is a hard failure, and so is a
        # missing klt (--require-klt, issue #63). Warm-up files only.
        run: ./scripts/warmup-regression.sh --no-fetch --require-klt

      - name: Puzzle extraction regression
        # issue #68: puzzle.gds -> tools/extract and klt extract -> compare
        # against evidence/puzzle-extracted.v, the one-floating-net invariant,
        # and a mutation check. Outputs land in gitignored build/.
        run: ./scripts/puzzle-regression.sh --no-fetch --require-klt

      - name: Assert no upstream puzzle file is tracked
        run: ./scripts/check-embargo.sh

      - name: Assert working tree is clean
        # Belt and braces on top of check-embargo.sh: a working tree that is not
        # clean after the run would mean the fetch or the regression wrote
        # something into version control.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after the run:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean; nothing from puzzle/ was staged."
